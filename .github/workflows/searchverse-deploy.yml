name: Deploy SearchVerse hub
on:
  push:
    branches: [main, claude/festive-ramanujan-b4894r]
    paths: ["searchverse/**", ".github/workflows/searchverse-deploy.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 20e3561f83fd2e0b7a868adab82391e9
          workingDirectory: searchverse
