name = "searchverse-yt-audit"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Optional: override the Gemini model used for AI review.
# [vars]
# GEMINI_MODEL = "gemini-2.5-flash"

# Secrets (never commit these): run
#   npx wrangler secret put YT_API_KEY
#   npx wrangler secret put GEMINI_API_KEY

# Open-source AI models on Cloudflare (free daily allowance, no API key):
# Llama 3.3 (text), Llama 3.2 Vision (thumbnail review), FLUX.1 schnell (images).
[ai]
binding = "AI"
