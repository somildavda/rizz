name = "searchverse"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "searchverse"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Admins: full access (connect Google accounts, create projects, manage users). Comma separated.
# If left empty, the first person to sign in becomes admin.
ADMIN_EMAILS = ""
# Optional: let anyone matching these emails / "@domain.com" self-join as a member (they see no projects
# until an admin gives access). Leave empty so that only users an admin adds can sign in.
ALLOWED_EMAILS = ""
GEMINI_MODEL = "gemini-3.8-flash"
# Tried in order if the main model is busy (free tier)
GEMINI_FALLBACK_MODELS = "gemini-flash-latest,gemini-flash-lite-latest"
# Last backup: Cloudflare's free built-in AI (no key needed)
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Secrets (set with `npx wrangler secret put NAME`):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, APP_SECRET, GEMINI_API_KEY (optional; users can add their own)
