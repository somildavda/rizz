name = "seo-insights"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
CLAUDE_MODEL = "claude-opus-5-5"
# GSC_SITE_URL = "sc-domain:example.com"

# Secrets (set with `wrangler secret put <NAME>`):
