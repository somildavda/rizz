name = "searchverse-insights"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Saved settings, Google sign-in, clients and reports. Wrangler creates the namespace on first deploy.
[[kv_namespaces]]
binding = "SETTINGS"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
CLAUDE_MODEL = "claude-opus-5-5"
# GSC_SITE_URL = "sc-domain:example.com"

# Secrets (set with `wrangler secret put <NAME>`):
#   GEMINI_API_KEY      - free key from aistudio.google.com, powers the AI insights
#   ANTHROPIC_API_KEY   - optional alternative to Gemini
#   GSC_SERVICE_ACCOUNT - optional, full JSON key of a Google service account
#   ACCESS_TOKEN        - optional, simple password protecting the tool
